[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-eo-sourcegraph-search"
version = "0.1.0"
description = "Trace one query through Sourcegraph's streaming search API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Spring Innovate" },
]
dependencies = [
  "certifi",
]

[project.scripts]
sourcegraph-search = "nasa_eo_search.sourcegraph:main"
nasa-product-preview = "nasa_eo_search.cmr:main"
nasa-repo-preview = "nasa_eo_search.repo_preview:main"
nasa-repo-search = "nasa_eo_search.repo_search:main"

[tool.setuptools.packages.find]
where = ["src"]
